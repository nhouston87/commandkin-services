name: Repository CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository content
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate tracked documentation and source formatting
        run: python3 scripts/check_repository.py

  required:
    name: Services CI
    if: ${{ always() }}
    needs: [repository]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all baseline checks to pass
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
        run: test "$REPOSITORY_RESULT" = success
